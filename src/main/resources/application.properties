spring.application.name=employee-task-management
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_tasks?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-before-deployment-32-characters-minimum}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}